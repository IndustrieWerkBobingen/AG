<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IWB Technik-AG &ndash; Begleitung und Bewertung</title>
<style>
:root{
  --blau:#005098; --blau-dunkel:#0A2C4F; --blau-hell:#E6EEF7;
  --gruen:#5A9E2F; --rot:#B3261E; --gelb:#B8860B;
  --grau-bg:#F2F4F6; --grau-linie:#DDE3E9; --text:#1E2A33; --text-hell:#5B6B78;
  --radius:10px; --radius-klein:6px;
  --schatten:0 1px 2px rgba(10,40,70,.05), 0 6px 20px rgba(10,40,70,.06);
  --schatten-hover:0 2px 4px rgba(10,40,70,.07), 0 12px 28px rgba(10,40,70,.10);
  --weich:.22s cubic-bezier(.2,.7,.3,1);
}
@keyframes einblenden{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes aufpoppen{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes schleier{from{opacity:0}to{opacity:1}}
@keyframes wackeln{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Open Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
     color:var(--text);background:linear-gradient(180deg,#F6F8FA 0%,#EEF1F4 100%) fixed;font-size:15px;line-height:1.5}
main section{animation:einblenden .28s ease both}
.topbar{background:linear-gradient(90deg,var(--blau-dunkel),#005098 70%,#15649c);color:#cfe0ee;font-size:12.5px;padding:5px 20px;
        display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center}
.topbar a{color:#cfe0ee}
header{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--blau);padding:10px 20px;
       display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;border-left:5px solid var(--blau);padding:2px 0 2px 12px}
.logo .txt strong{display:block;font-size:16px}
.logo .txt span{font-size:11.5px;color:var(--text-hell);text-transform:uppercase;letter-spacing:1.3px}
.firmenlogo{height:38px;width:auto;flex-shrink:0}
nav{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:none;font:inherit;font-size:13px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--text-hell);padding:9px 13px;cursor:pointer;position:relative;border-radius:var(--radius-klein);transition:color var(--weich),background var(--weich)}
nav button::after{content:"";position:absolute;left:13px;right:13px;bottom:2px;height:3px;border-radius:2px;background:var(--blau);
  transform:scaleX(0);transition:transform var(--weich)}
nav button:hover{color:var(--blau);background:var(--blau-hell)}
nav button.aktiv{color:var(--blau);font-weight:600}
nav button.aktiv::after{transform:scaleX(1)}
nav button .zahl{display:inline-block;background:var(--rot);color:#fff;border-radius:9px;font-size:10.5px;padding:0 6px;margin-left:5px;letter-spacing:0;font-weight:700;line-height:17px}
#kopfbereich{position:sticky;top:0;z-index:60;box-shadow:0 2px 12px rgba(10,40,70,.08)}
main{padding:14px 20px 40px;max-width:1500px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin:0 0 3px}
h2{font-size:16px;font-weight:600;margin:22px 0 9px;color:var(--blau-dunkel)}
h2:first-child{margin-top:0}
h3{font-size:14px;font-weight:600;margin:16px 0 6px;color:var(--blau-dunkel)}
.sub{color:var(--text-hell);font-size:13px;margin:0 0 14px}
.karte{background:#fff;border:1px solid var(--grau-linie);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--schatten);transition:box-shadow var(--weich)}
.karte:hover{box-shadow:var(--schatten-hover)}
.karte.schmal{max-width:760px}
.kennzahlen{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kz{background:#fff;border:1px solid var(--grau-linie);border-top:3px solid var(--blau);
    padding:10px 16px;min-width:130px;border-radius:var(--radius-klein);box-shadow:var(--schatten);transition:transform var(--weich),box-shadow var(--weich)}
.kz.klick{cursor:pointer}
.kz:hover{transform:translateY(-2px);box-shadow:var(--schatten-hover)}
.kz b{display:block;font-size:20px;font-weight:700;color:var(--blau-dunkel);line-height:1.2}
.kz span{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--text-hell)}
.kz.warn{border-top-color:var(--rot)} .kz.warn b{color:var(--rot)}
.kz.gelb{border-top-color:var(--gelb)} .kz.gelb b{color:var(--gelb)}
.kz.gruen{border-top-color:var(--gruen)} .kz.gruen b{color:var(--gruen)}
.kz.blau{border-top-color:var(--blau)} .kz.blau b{color:var(--blau)}
table.liste{width:100%;border-collapse:collapse;font-size:13.5px}
table.liste th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-hell);
  border-bottom:2px solid var(--grau-linie);padding:7px 9px;white-space:nowrap;background:#fff;position:sticky;top:0}
table.liste td{border-bottom:1px solid var(--grau-linie);padding:7px 9px;vertical-align:middle}
table.liste tbody tr:hover{background:var(--blau-hell)}
table.liste tbody tr.leer:hover{background:none}
table.liste td.mitte,table.liste th.mitte{text-align:center}
.btn{background:var(--blau);color:#fff;border:none;border-radius:var(--radius-klein);font:inherit;font-size:13.5px;
  padding:9px 16px;cursor:pointer;transition:background var(--weich),transform var(--weich)}
.btn:hover{background:var(--blau-dunkel)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.sek{background:#fff;color:var(--blau);border:1px solid var(--grau-linie)}
.btn.sek:hover{background:var(--blau-hell)}
.btn.gefahr{background:var(--rot)} .btn.gefahr:hover{background:#8d1e18}
.btn.gruen{background:var(--gruen)} .btn.gruen:hover{background:#487d25}
.btn.klein{padding:5px 10px;font-size:12.5px}
.werkzeuge{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-hell);margin:0 0 4px}
input,select,textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--grau-linie);border-radius:var(--radius-klein);
  background:#fff;color:var(--text);width:100%;transition:border var(--weich),box-shadow var(--weich)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blau);box-shadow:0 0 0 3px rgba(0,80,152,.12)}
textarea{min-height:76px;resize:vertical}
.feldreihe{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
.feldreihe .voll{grid-column:1/-1}
.formhinweis{font-size:12.5px;color:var(--text-hell);margin:-4px 0 12px}
.hinweis{background:var(--blau-hell);border-left:3px solid var(--blau);padding:10px 13px;font-size:13px;border-radius:0 var(--radius-klein) var(--radius-klein) 0;margin-bottom:12px}
.hinweis.rot{background:#FBEEED;border-left-color:var(--rot)}
.hinweis.gruen{background:#EDF5E5;border-left-color:var(--gruen)}
.hinweis.gelb{background:#FDF6E3;border-left-color:var(--gelb)}
.marke{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;padding:2px 8px;border-radius:20px;white-space:nowrap}
.marke.gruen{background:#EDF5E5;color:#3C6B1E} .marke.rot{background:#FBEEED;color:var(--rot)}
.marke.gelb{background:#FDF6E3;color:#8a6508} .marke.grau{background:#EEF1F4;color:var(--text-hell)}
.marke.blau{background:var(--blau-hell);color:var(--blau)}
.schleier{position:fixed;inset:0;background:rgba(10,40,70,.45);display:flex;align-items:center;justify-content:center;
  z-index:200;padding:16px;animation:schleier .18s ease both;overflow:auto}
.fenster{background:#fff;border-radius:var(--radius);max-width:720px;width:100%;max-height:92vh;overflow:auto;
  box-shadow:0 24px 60px rgba(10,40,70,.3);animation:aufpoppen .22s ease both}
.fenster .kopf{padding:16px 20px;border-bottom:1px solid var(--grau-linie);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#fff;z-index:2}
.fenster .kopf h2{margin:0;font-size:17px}
.fenster .inhalt{padding:20px}
.fenster .fuss{padding:14px 20px;border-top:1px solid var(--grau-linie);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:#fff}
.x{margin-left:auto;background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--text-hell);padding:0 4px}
.x:hover{color:var(--rot)}
#toastbox{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--blau-dunkel);color:#fff;padding:10px 18px;border-radius:22px;font-size:13.5px;box-shadow:0 8px 24px rgba(10,40,70,.25);animation:aufpoppen .2s ease both}
.loginhuelle{position:fixed;inset:0;background:#0A2C4F;display:flex;align-items:center;justify-content:center;z-index:300;padding:16px;overflow:auto}
.loginkarte{background:#fff;border-radius:var(--radius);width:100%;max-width:420px;padding:30px}
.loginkarte img{height:34px;margin-bottom:18px}
.loginkarte h2{margin:0 0 4px;font-size:19px;color:var(--blau-dunkel)}
.loginkarte p{margin:0 0 18px;font-size:13px;color:var(--text-hell)}
.loginkarte button{width:100%;margin-top:20px;padding:11px}
.loginfehler{background:#FBEEED;color:var(--rot);padding:9px 12px;font-size:13px;margin-top:14px;border-radius:var(--radius-klein)}
.testleiste{background:#FDF6E3;border-bottom:1px solid #EAD9A8;padding:6px 20px;display:none;gap:14px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.testleiste label{display:flex;align-items:center;gap:6px;margin:0;text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--text)}
.testleiste select{width:auto;padding:4px 8px;font-size:12.5px}
/* Tablet / Schüler */
.standby{position:fixed;inset:0;background:linear-gradient(160deg,#0A2C4F,#005098);display:flex;align-items:center;justify-content:center;z-index:250;padding:20px}
.standbykarte{background:#fff;border-radius:16px;max-width:960px;width:100%;padding:32px;text-align:center;max-height:94vh;overflow:auto}
.standbykarte img{height:38px;margin-bottom:10px}
.namen{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:22px}
.namen button{font:inherit;font-size:17px;font-weight:600;padding:20px 10px;border-radius:12px;border:1px solid var(--grau-linie);
  background:#fff;color:var(--blau-dunkel);cursor:pointer;transition:all var(--weich)}
.namen button:hover{background:var(--blau-hell);border-color:var(--blau);transform:translateY(-2px)}
.pinkarte{max-width:400px;text-align:center}
.pinpunkte{display:flex;gap:16px;justify-content:center;margin:18px 0 8px}
.pinpunkte span{width:18px;height:18px;border-radius:50%;border:2px solid var(--blau);transition:background var(--weich)}
.pinpunkte span.voll{background:var(--blau)}
.pinpunkte.falsch{animation:wackeln .35s}
.pinfehler{min-height:20px;font-size:13px;color:var(--rot)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.pinpad button{font:inherit;font-size:24px;font-weight:600;padding:16px 0;border-radius:12px;border:1px solid var(--grau-linie);background:#fff;color:var(--blau-dunkel);cursor:pointer}
.pinpad button:active{background:var(--blau-hell)}
.pinpad button.leise{font-size:15px;color:var(--text-hell)}
/* Bewertung */
.skala{display:flex;gap:4px;flex-wrap:nowrap}
.skala button{font:inherit;font-size:12px;font-weight:700;width:34px;height:32px;border-radius:var(--radius-klein);
  border:1px solid var(--grau-linie);background:#fff;color:var(--text-hell);cursor:pointer;transition:all var(--weich)}
.skala button:hover{border-color:var(--blau);color:var(--blau)}
.skala button.an{background:var(--blau);border-color:var(--blau);color:#fff}
.skala button.an.w1{background:var(--gruen);border-color:var(--gruen)}
.skala button.an.w2{background:#7FB04A;border-color:#7FB04A}
.skala button.an.w3{background:var(--gelb);border-color:var(--gelb)}
.skala button.an.w4{background:#D2691E;border-color:#D2691E}
.skala button.an.w5{background:var(--rot);border-color:var(--rot)}
.matrixzelle{display:inline-block;width:30px;height:24px;line-height:24px;text-align:center;border-radius:5px;font-size:12px;font-weight:700;color:#fff}
.m1{background:var(--gruen)} .m2{background:#7FB04A} .m3{background:var(--gelb)} .m4{background:#D2691E} .m5{background:var(--rot)}
.m0{background:#EEF1F4;color:var(--text-hell)}
.bereichzeile td{background:var(--blau-hell);font-weight:600;color:var(--blau);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.fotos{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.fotos figure{margin:0;width:140px}
.fotos img{width:100%;height:100px;object-fit:cover;border-radius:var(--radius-klein);border:1px solid var(--grau-linie);display:block}
.fotos figcaption{font-size:11px;color:var(--text-hell);margin-top:3px;text-align:center}
.leerzustand{text-align:center;padding:40px 20px;color:var(--text-hell)}
.leerzustand b{display:block;font-size:16px;color:var(--text);margin-bottom:6px}
.gruppenwahl{display:flex;align-items:center;gap:8px}
.gruppenwahl select{width:auto;min-width:190px}
.druckbar{display:none}
@media print{
  .topbar,header,.testleiste,.werkzeuge,#toastbox,.btn{display:none !important}
  main{padding:0;max-width:none}
  .karte{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .druckbar{display:block}
}
@media(max-width:720px){
  main{padding:12px 12px 32px}
  nav{width:100%;margin-left:0;overflow:auto}
  .firmenlogo{height:30px}
  .fenster .inhalt{padding:14px}
}
</style>

<div id="kopfbereich">
  <div class="topbar">
    <span>IWB&nbsp;Technik-AG &ndash; Begleitung, Arbeitsbl&auml;tter und Bewertung</span>
    <span>
      <span id="cloudStatus">&#9679; lokal</span>
      <span id="topBenutzer" style="margin-left:14px"></span>
      <button class="btn sek klein" id="topAbmelden" style="display:none;margin-left:12px" onclick="abmelden()">Abmelden</button>
    </span>
  </div>
  <div class="testleiste" id="testleiste">
    <b>Testmodus</b>
    <label>Ansicht als
      <select id="testRolle" onchange="testRolleSetzen(this.value)">
        <option value="dozent">Dozent</option>
        <option value="lehrkraft">Lehrkraft</option>
        <option value="tablet">Gruppen-Tablet (Sch&uuml;ler)</option>
        <option value="eltern">Eltern-Einsicht</option>
      </select>
    </label>
    <button class="btn sek klein" onclick="beispieldaten()">Beispieldaten laden</button>
    <button class="btn sek klein" onclick="demoJahr()">Demo-Jahr 2025/26</button>
    <button class="btn sek klein" onclick="testLeeren()">Alles l&ouml;schen</button>
    <span style="color:var(--text-hell)">Daten liegen nur in diesem Browser.</span>
  </div>
  <header>
    <img class="firmenlogo" id="kopfLogo" alt="IWB">
    <div class="logo"><div class="txt"><strong>Technik-AG</strong><span>Berufsorientierung</span></div></div>
    <div class="gruppenwahl" id="gruppenWahl" style="display:none">
      <select id="gruppeSel" onchange="gruppeSetzen(this.value)"></select>
    </div>
    <nav id="navi"></nav>
  </header>
</div>

<main id="haupt"></main>

<div id="fensterBox"></div>
<div id="loginBox"></div>
<div id="standbyBox"></div>
<div id="toastbox"></div>

  el('toastbox').appendChild(d); setTimeout(() => { d.style.opacity = '0'; d.style.transition = 'opacity .3s'; setTimeout(() => d.remove(), 320); }, 2400); }

function datumDe(s){ if(!s) return '–'; const t = String(s).split('-'); return t.length===3 ? t[2]+'.'+t[1]+'.'+t[0] : s; }
function heute(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const ZEICHEN = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function neuerCode(n){ const z = new Uint32Array(n||8); crypto.getRandomValues(z); return Array.from(z, x => ZEICHEN[x % ZEICHEN.length]).join(''); }

/* QR-Code als SVG – ohne Nachladen aus dem Netz */
function qrSvg(text, groesse, einheit){
  try {
    const q = new QRCode(-1, 1);          // Stufe L reicht für einen kurzen Link
    q.addData(text); q.make();
    const n = q.getModuleCount(), r = 2, N = n + 2*r; let d = '';
    for(let y = 0; y < n; y++) for(let x = 0; x < n; x++) if(q.isDark(y, x)) d += 'M'+(x+r)+' '+(y+r)+'h1v1h-1z';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+N+' '+N+'" width="'+groesse+(einheit||'mm')+
      '" height="'+groesse+(einheit||'mm')+'" shape-rendering="crispEdges">'+
      '<rect width="'+N+'" height="'+N+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
  } catch(e){ return '<p class="sub">QR-Code konnte nicht erzeugt werden.</p>'; }
}

/* ops: [['set', sammlung, id, objekt] | ['del', sammlung, id]] */
function schreibe(ops){
  ops = einsichtErgaenzen(ops);
  if(!cloudAktiv){
    ops.forEach(([a,c,id,o]) => { if(a === 'set') D[c][id] = sauber(o); else delete D[c][id]; });
    lokalSpeichern(); alles(); return Promise.resolve();
  }
  const teile = []; for(let i = 0; i < ops.length; i += 400) teile.push(ops.slice(i, i+400));
  return teile.reduce((p,t) => p.then(() => {
    const b = db.batch();
    t.forEach(([a,c,id,o]) => { const r = db.collection(c).doc(id); if(a === 'set') b.set(r, sauber(o)); else b.delete(r); });
    return b.commit();
  }), Promise.resolve()).catch(e => { fehler(e); throw e; });
}

/* ---------- Einsicht für Eltern und Schüler spiegeln ----------
   Für jeden Schüler ein öffentlich lesbares Dokument unter seinem Code.
   Enthält nur freigegebene Einheiten.                                   */
function einsichtBauen(sid, stand){
  const s = (stand && stand.schueler[sid]) || D.schueler[sid]; if(!s) return null;
  const q = stand || D;
  const g = q.gruppen[s.gid] || {};
  const liste = Object.values(q.einheiten).filter(e => e.gid === s.gid && e.status === 'frei')
    .sort((a,b) => String(a.datum||'').localeCompare(String(b.datum||'')));
  /* Alle noch nicht abgeschlossenen Termine mitgeben – gefiltert wird erst beim Anzeigen,
     damit die Liste nicht veraltet, wenn länger nichts geschrieben wurde. */
  const termine = Object.values(q.einheiten)
    .filter(e => e.gid === s.gid && e.status !== 'frei' && e.datum)
    .sort((a,b) => String(a.datum).localeCompare(String(b.datum)))
    .map(e => ({ nr:e.nr, titel:e.titel, datum:e.datum }));
  return {
    code: s.code, sid: sid, name: s.vorname + ' ' + s.nachname, klasse: s.klasse || '',
    gruppe: g.name || '', schule: g.schule || '', schuljahr: g.schuljahr || '',
    aktualisiert: new Date().toISOString(),
    termine: termine,
    einheiten: liste.map(e => {
      const k = e.id + '_' + sid;
      const a = q.anw[k] || {}, b = q.bew[k] || {}, t = q.antw[k] || {};
      return { nr:e.nr, titel:e.titel, datum:e.datum, anwesend:a.status || '',
        bew: b.w || {}, bem: b.bem || '', pos: b.pos || '', next: b.next || '',
        antworten: t.f || {}, fotos: t.fotos || [] };
    })
  };
}
function einsichtErgaenzen(ops){
  const betroffen = new Set();
  const stand = { gruppen:Object.assign({},D.gruppen), schueler:Object.assign({},D.schueler),
                  einheiten:Object.assign({},D.einheiten), anw:Object.assign({},D.anw),
                  bew:Object.assign({},D.bew), antw:Object.assign({},D.antw) };
  ops.forEach(([a,c,id,o]) => {
    if(stand[c]){ if(a === 'set') stand[c][id] = o; else delete stand[c][id]; }
    if(c === 'schueler') betroffen.add(id);
    if(c === 'anw' || c === 'bew' || c === 'antw') betroffen.add(String(id).split('_')[1]);
    if(c === 'einheiten' && o) Object.values(stand.schueler).filter(s => s.gid === o.gid).forEach(s => betroffen.add(s.id));
  });
  const extra = [];
  betroffen.forEach(sid => {
    const s = stand.schueler[sid]; if(!s || !s.code) return;
    extra.push(['set','einsicht', s.code, einsichtBauen(sid, stand)]);
  });
  return ops.concat(extra);
}

/* ---------- Übersicht ---------- */
function ansUebersicht(g){
  if(!g) return leerHinweis('Noch keine Gruppe angelegt', 'Lege unter <b>Gruppen</b> deine erste Gruppe an und trage die Schüler ein. Danach erscheint hier die Übersicht.');
  const sch = schuelerDer(g.id), eh = einheitenDer(g.id);
  const frei = eh.filter(e => e.status === 'frei').length;
  const naechste = eh.filter(e => e.status !== 'frei' && e.datum >= heute())[0] || eh.filter(e => e.status !== 'frei')[0];
  const offen = eh.filter(e => e.status === 'offen').length;
  let fehlendeBew = 0;
  eh.filter(e => e.status !== 'geplant').forEach(e => sch.forEach(s => {
    const b = D.bew[e.id+'_'+s.id]; if(!b || !Object.keys(b.w||{}).length) fehlendeBew++;
  }));
  const quote = sch.length && eh.length ? Math.round(100 * Object.values(D.anw).filter(a => a.status==='da' && D.schueler[a.sid] && D.schueler[a.sid].gid===g.id).length /
      Math.max(1, sch.length * eh.filter(e => e.status !== 'geplant').length)) : 0;

  let h = '<section><h1>'+esc(g.name)+'</h1><p class="sub">'+esc(g.schule||'')+' · Schuljahr '+esc(g.schuljahr||'')+'</p>';
  h += '<div class="kennzahlen">'+
    kz(sch.length,'Schüler')+kz(eh.length,'Einheiten geplant')+kz(frei,'freigegeben','gruen')+
    kz(offen,'in Erfassung','gelb')+kz(fehlendeBew,'Bewertungen offen', fehlendeBew ? 'warn' : 'gruen')+
    kz(quote+' %','Anwesenheit')+'</div>';

  h += '<div class="karte"><h2>Nächste Einheit</h2>';
  if(naechste){
    h += '<p style="font-size:17px;margin:0 0 4px"><b>'+esc(nrText(naechste.nr))+' – '+esc(naechste.titel)+'</b></p>'+
         '<p class="sub">'+datumDe(naechste.datum)+' · '+statusMarke(naechste)+'</p>'+
         (schreibDarf() ? '<button class="btn" onclick="einheitOeffnen(\''+naechste.id+'\')">Einheit öffnen</button>' : '');
  } else h += '<p class="sub">Keine offene Einheit. Unter <b>Einheiten</b> kannst du den Jahresplan anlegen.</p>';
  h += '</div>';

  h += '<div class="karte"><h2>Schüler</h2>';
  if(!sch.length) h += '<p class="sub">Noch keine Schüler in dieser Gruppe. Unter <b>Gruppen</b> eintragen.</p>';
  else {
    h += '<div style="overflow:auto"><table class="liste"><thead><tr><th>Name</th><th>Klasse</th><th class="mitte">Anwesend</th><th class="mitte">Arbeitsblätter</th><th class="mitte">Bewertet</th><th>Einsichtscode</th></tr></thead><tbody>';
    sch.forEach(s => {
      const ehz = eh.filter(e => e.status !== 'geplant');
      const da = ehz.filter(e => (D.anw[e.id+'_'+s.id]||{}).status === 'da').length;
      const ab = ehz.filter(e => (D.antw[e.id+'_'+s.id]||{}).ab).length;
      const bw = ehz.filter(e => Object.keys((D.bew[e.id+'_'+s.id]||{}).w||{}).length).length;
      h += '<tr><td><b>'+esc(s.vorname+' '+s.nachname)+'</b></td><td>'+esc(s.klasse||'')+'</td>'+
        '<td class="mitte">'+da+' / '+ehz.length+'</td><td class="mitte">'+ab+' / '+ehz.length+'</td>'+
        '<td class="mitte">'+bw+' / '+ehz.length+'</td>'+
        '<td><code style="font-size:12px">'+esc(s.code||'')+'</code> '+
        '<button class="btn sek klein" onclick="codeZettel(\''+s.id+'\')">Zettel</button></td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div></section>';
  return h;
}
const kz = (w,t,k) => '<div class="kz'+(k?' '+k:'')+'"><b>'+esc(w)+'</b><span>'+esc(t)+'</span></div>';

/* Eine Einheit gilt erst als geplant, wenn ein Datum eingetragen ist. */
function statusMarke(e){
  const st = (typeof e === 'string') ? e : (e || {}).status;
  const ohneDatum = (typeof e === 'object') && e && !e.datum;
  if(st === 'geplant' && ohneDatum) return '<span class="marke rot">ohne Termin</span>';
  return ({ geplant:'<span class="marke grau">geplant</span>', offen:'<span class="marke gelb">in Erfassung</span>',
    frei:'<span class="marke gruen">freigegeben</span>' }[st] || '');
}

function freigabe(eid, an){

/* ---------- Einheit erfassen: Anwesenheit + Bewertung + Blätter ---------- */
function einheitOeffnen(eid){
  const e = D.einheiten[eid]; if(!e) return;
  const sch = schuelerDer(e.gid);
  let h = '<div class="werkzeuge"><span class="marke blau">'+esc(nrText(e.nr))+'</span>'+statusMarke(e)+
    '<span style="margin-left:auto"></span>'+
    (schreibDarf() ? '<label style="display:flex;align-items:center;gap:6px;margin:0;text-transform:none;letter-spacing:0">Datum <input type="date" id="ehDatum" value="'+esc(e.datum||'')+'" onchange="einheitDatum(\''+eid+'\',this.value)" style="width:auto"></label>' : '')+'</div>';
  if(!e.datum) h += '<div class="hinweis rot"><b>Noch kein Termin eingetragen.</b> '+
    'Erst mit einem Datum gilt die Einheit als geplant und erscheint bei Schülern und Eltern in der Terminliste. '+
    'Das Datum trägst du oben rechts ein.</div>';
  if(!sch.length) h += '<div class="hinweis rot">In dieser Gruppe sind noch keine Schüler eingetragen.</div>';
  h += '<div style="overflow:auto"><table class="liste"><thead><tr><th>Schüler</th><th style="width:230px">Anwesenheit</th><th class="mitte" style="width:120px">Arbeitsblatt</th><th class="mitte" style="width:110px">Bewertung</th><th style="width:150px"></th></tr></thead><tbody>';
  sch.forEach(s => {
    const k = eid+'_'+s.id, a = D.anw[k] || {}, b = D.bew[k] || {}, t = D.antw[k] || {};
    const anzahl = Object.keys(b.w||{}).length;
    h += '<tr><td><b>'+esc(s.vorname+' '+s.nachname)+'</b>'+(b.sp?' <span class="marke blau">Schwerpunkt</span>':'')+'</td>'+
      '<td>'+(schreibDarf()
        ? ['da','Da','ent','Entschuldigt','fehlt','Fehlt'].reduce((acc,_,i,arr) => i%2 ? acc : acc +
            '<button class="btn '+(a.status===arr[i]?'':'sek')+' klein" onclick="anwSetzen(\''+eid+'\',\''+s.id+'\',\''+arr[i]+'\')">'+arr[i+1]+'</button> ', '')
        : (a.status==='da'?'<span class="marke gruen">Da</span>':a.status==='ent'?'<span class="marke gelb">Entschuldigt</span>':a.status==='fehlt'?'<span class="marke rot">Fehlt</span>':'<span class="marke grau">–</span>'))+'</td>'+
      '<td class="mitte">'+(t.ab ? '<span class="marke gruen">abgegeben</span>' : (Object.keys(t.f||{}).length ? '<span class="marke gelb">begonnen</span>' : '<span class="marke grau">offen</span>'))+'</td>'+
      '<td class="mitte">'+(anzahl ? '<span class="marke gruen">'+anzahl+' / 12</span>' : '<span class="marke grau">offen</span>')+'</td>'+
      '<td style="text-align:right"><button class="btn sek klein" onclick="bewertenOeffnen(\''+eid+'\',\''+s.id+'\')">Bewerten</button> '+
      '<button class="btn sek klein" onclick="blattAnsehen(\''+eid+'\',\''+s.id+'\')">Blatt</button></td></tr>';
  });
  h += '</tbody></table></div>';
  if(schreibDarf()){
    h += '<div class="hinweis" style="margin-top:14px"><b>Was die Eltern sehen:</b> '+
      '<b>Geplant</b> und <b>in Erfassung</b> – Datum und Thema in der Terminliste. '+
      '<b>Freigegeben</b> – zusätzlich Anwesenheit, Bewertung, Rückmeldung und Arbeitsblatt. '+
      'Die Einheit, die auf <b>in Erfassung</b> steht, ist die, an der die Schüler am Tablet arbeiten.</div>';
  }
  const knopf = (st, txt, art) => '<button class="btn '+(e.status === st ? art : 'sek')+'"'+
    (e.status === st ? ' disabled' : '')+' onclick="statusSetzen(\''+eid+'\',\''+st+'\')">'+txt+'</button>';
  fenster(nrText(e.nr) + ' – ' + (e.titel||''), h,
    (schreibDarf()
      ? knopf('geplant','Geplant','') + knopf('offen','In Erfassung','') + knopf('frei','Freigegeben','gruen')
      : '')+
    '<button class="btn sek" onclick="schliesse()">Schließen</button>', 980);
}
function statusSetzen(eid, st){
  const e = D.einheiten[eid]; if(!e || e.status === st) return;
  if(st === 'geplant' && !e.datum){
    toast('Bitte zuerst ein Datum eintragen – ohne Termin ist die Einheit nicht geplant');
    const f = el('ehDatum'); if(f) f.focus();
    return;
  }
  if(st === 'frei' && !confirm('Einheit freigeben?\n\nSchüler und Eltern sehen danach Anwesenheit, Bewertung, Rückmeldung und Arbeitsblatt dieser Einheit.')) return;
  if(e.status === 'frei' && st !== 'frei' && !confirm('Freigabe zurücknehmen?\n\nDie Einheit verschwindet bei Schülern und Eltern wieder aus der Rückmeldung und steht nur noch als Termin in der Liste.')) return;
  schreibe([['set','einheiten', eid, Object.assign({}, e, { status: st })]]).then(() => {
    toast({ geplant:'Steht als Termin in der Elternansicht', offen:'In Erfassung – die Schüler können am Tablet arbeiten',
            frei:'Freigegeben – für Schüler und Eltern sichtbar' }[st]);
    einheitOeffnen(eid);
  });
}
function einheitDatum(eid, d){
  const e = D.einheiten[eid];
  schreibe([['set','einheiten',eid,Object.assign({},e,{datum:d})]]).then(() => {
    if(d) toast('Termin eingetragen – die Einheit steht jetzt in der Elternansicht');
    einheitOeffnen(eid);
  });
}
function anwSetzen(eid, sid, st){
  const k = eid+'_'+sid; const alt = D.anw[k] || {};
  const neu = alt.status === st ? '' : st;
  const e = D.einheiten[eid];
  schreibe([['set','anw',k,{ eid, sid, status:neu }]]).then(() => einheitOeffnen(eid));
}

/* ---------- Bewertung je Schüler ---------- */
function bewertenOeffnen(eid, sid){
  const s = D.schueler[sid], e = D.einheiten[eid]; if(!s || !e) return;
  const k = eid+'_'+sid, b = D.bew[k] || { w:{} };
  const lesen = !schreibDarf();
  let h = '<div class="hinweis">'+esc(nrText(e.nr))+' · '+datumDe(e.datum)+' · '+esc(s.vorname+' '+s.nachname)+
    (lesen ? '' : '<label style="display:inline-flex;align-items:center;gap:6px;margin-left:14px;text-transform:none;letter-spacing:0">'+
      '<input type="checkbox" id="bSp" style="width:auto" '+(b.sp?'checked':'')+'> Schwerpunkt-Schüler heute</label>')+'</div>';
  h += '<div style="overflow:auto"><table class="liste"><thead><tr><th>Kriterium</th><th style="width:220px">Bewertung</th></tr></thead><tbody>';
  KRITERIEN.forEach(([bereich, items]) => {
    h += '<tr class="bereichzeile"><td colspan="2">'+esc(bereich)+'</td></tr>';
    items.forEach(([kid, txt]) => {
      const v = (b.w||{})[kid] || 0;
      h += '<tr><td>'+esc(txt)+'</td><td>'+(lesen
        ? (v ? '<span class="matrixzelle m'+v+'">'+SKALA[v-1][1]+'</span> '+SKALA[v-1][2] : '<span class="matrixzelle m0">–</span>')
        : '<div class="skala" id="sk_'+kid+'">'+SKALA.map(([n,z,t]) =>
            '<button class="'+(v===n?'an w'+n:'')+'" title="'+esc(t)+'" onclick="bewSetzen(\''+kid+'\','+n+')">'+z+'</button>').join('')+'</div>')+'</td></tr>';
    });
  });
  h += '</tbody></table></div>';
  if(lesen){
    h += bemBlock('Bemerkungen', b.bem) + bemBlock('Positiv aufgefallen', b.pos) + bemBlock('Daran arbeiten wir', b.next);
  } else {
    h += '<h3>Bemerkungen – konkrete Situationen statt allgemeiner Urteile</h3><textarea id="bBem">'+esc(b.bem||'')+'</textarea>'+
         '<h3>Das ist heute positiv aufgefallen</h3><textarea id="bPos">'+esc(b.pos||'')+'</textarea>'+
         '<h3>Daran arbeiten wir beim nächsten Mal</h3><textarea id="bNext">'+esc(b.next||'')+'</textarea>'+
         '<p class="formhinweis">Diese Texte sieht der Schüler, sobald die Einheit freigegeben ist.</p>';
  }
  window._bewAkt = { eid, sid, w: Object.assign({}, b.w || {}) };
  fenster('Bewertung: ' + s.vorname + ' ' + s.nachname, h,
    (lesen ? '' : '<button class="btn sek" onclick="bewLeeren()">Zurücksetzen</button><button class="btn" onclick="bewSpeichern()">Speichern</button>')+
    '<button class="btn sek" onclick="einheitOeffnen(\''+eid+'\')">Zurück</button>', 760);
}
const bemBlock = (t, v) => v ? '<h3>'+esc(t)+'</h3><p style="white-space:pre-wrap;margin:0 0 10px">'+esc(v)+'</p>' : '';
function bewSetzen(kid, n){
  const a = window._bewAkt; if(!a) return;
  a.w[kid] = a.w[kid] === n ? 0 : n; if(!a.w[kid]) delete a.w[kid];
  const box = el('sk_'+kid); if(!box) return;
  [...box.children].forEach((b,i) => { b.className = (a.w[kid] === i+1) ? 'an w'+(i+1) : ''; });
}
function bewLeeren(){ const a = window._bewAkt; if(!a) return; a.w = {};
  ALLE_KRIT.forEach(([kid]) => { const box = el('sk_'+kid); if(box) [...box.children].forEach(b => b.className = ''); }); }
function bewSpeichern(){
  const a = window._bewAkt; if(!a) return;
  const k = a.eid+'_'+a.sid, e = D.einheiten[a.eid];
  const ops = [['set','bew',k,{ eid:a.eid, sid:a.sid, w:a.w, bem:el('bBem').value.trim(),
    pos:el('bPos').value.trim(), next:el('bNext').value.trim(), sp: el('bSp') ? el('bSp').checked : false }]];
  schreibe(ops).then(() => { toast('Bewertung gespeichert'); einheitOeffnen(a.eid); });
}


/* ---------- Bewertung: Überblick über alle Schüler und Einheiten ---------- */
function ansBewertung(g){
  if(!g) return leerHinweis('Keine Gruppe', 'Lege zuerst unter <b>Gruppen</b> eine Gruppe an.');
  const sch = schuelerDer(g.id), eh = einheitenDer(g.id);
  let h = '<section><h1>Bewertung</h1><p class="sub">Beobachtung je Schüler und Einheit · '+esc(g.name)+'</p>';
  if(!sch.length) return h + leerHinweis('Keine Schüler','Trage die Schüler unter <b>Gruppen</b> ein.') + '</section>';
  if(!eh.length)  return h + leerHinweis('Keine Einheiten','Lege unter <b>Einheiten</b> den Jahresplan an.') + '</section>';

  const offen = [];
  eh.filter(e => e.status !== 'geplant').forEach(e => sch.forEach(s => {
    if(!Object.keys((D.bew[e.id+'_'+s.id]||{}).w||{}).length && (D.anw[e.id+'_'+s.id]||{}).status === 'da') offen.push([e,s]);
  }));
  if(offen.length) h += '<div class="hinweis gelb"><b>'+offen.length+' Bewertungen offen.</b> Schüler, die anwesend waren, aber noch keine Eintragung haben.</div>';

  h += '<div class="karte"><div style="overflow:auto"><table class="liste"><thead><tr><th style="min-width:190px">Schüler</th>'+
    eh.map(e => '<th class="mitte" title="'+esc(e.titel)+' – '+datumDe(e.datum)+'">'+esc(String(e.nr))+'</th>').join('')+
    '<th class="mitte">Schnitt</th></tr></thead><tbody>';
  sch.forEach(s => {
    let summe = 0, anzahl = 0;
    const zellen = eh.map(e => {
      const b = D.bew[e.id+'_'+s.id] || {}, w = b.w || {}, k = Object.keys(w);
      const a = D.anw[e.id+'_'+s.id] || {};
      if(k.length){ const m = k.reduce((x,i) => x + w[i], 0) / k.length; summe += m; anzahl++;
        const st = Math.round(m);
        return '<td class="mitte" style="cursor:pointer" onclick="bewertenOeffnen(\''+e.id+'\',\''+s.id+'\')" title="'+k.length+' von 12 Kriterien">'+
          '<span class="matrixzelle m'+st+'">'+SKALA[st-1][1]+'</span></td>';
      }
      const zeichen = e.status === 'geplant' ? '·' : (a.status && a.status !== 'da' ? 'f' : '–');
      return '<td class="mitte" style="cursor:pointer" onclick="bewertenOeffnen(\''+e.id+'\',\''+s.id+'\')"><span class="matrixzelle m0">'+zeichen+'</span></td>';
    }).join('');
    const schnitt = anzahl ? (summe/anzahl) : 0;
    h += '<tr><td><b>'+esc(s.vorname+' '+s.nachname)+'</b></td>'+zellen+
      '<td class="mitte">'+(anzahl ? '<span class="matrixzelle m'+Math.round(schnitt)+'">'+SKALA[Math.round(schnitt)-1][1]+'</span>' : '<span class="matrixzelle m0">–</span>')+'</td></tr>';
  });
  h += '</tbody></table></div>';
  h += '<p class="formhinweis" style="margin-top:10px">Zelle anklicken, um zu bewerten. Angezeigt wird der Durchschnitt der eingetragenen Kriterien. '+
       '<b>f</b> = gefehlt · <b>–</b> = noch nichts eingetragen · <b>·</b> = Einheit noch nicht gestartet.</p>';
  h += '<p class="formhinweis">'+SKALA.map(([n,z,t]) => '<span class="matrixzelle m'+n+'">'+z+'</span> '+esc(t)).join(' &nbsp; ')+'</p>';
  return h + '</div></section>';
}

/* ---------- Arbeitsblätter ---------- */
function ansBlaetter(g){

  const eh = einheitenDer(g.id), sch = schuelerDer(g.id);
  let h = '<section><h1>Arbeitsblätter</h1><p class="sub">Was die Schüler in der Oberfläche eingetragen haben</p>';

  h += '<div class="karte"><div style="overflow:auto"><table class="liste"><thead><tr><th>Schüler</th>'+
    eh.map(e => '<th class="mitte" title="'+esc(e.titel)+'">'+esc(String(e.nr))+'</th>').join('')+'</tr></thead><tbody>';
  sch.forEach(s => {
    h += '<tr><td><b>'+esc(s.vorname+' '+s.nachname)+'</b></td>' + eh.map(e => {
      const t = D.antw[e.id+'_'+s.id] || {};
      const z = t.ab ? '<span class="matrixzelle m1" title="abgegeben">✓</span>'
              : (Object.keys(t.f||{}).length ? '<span class="matrixzelle m3" title="begonnen">·</span>' : '<span class="matrixzelle m0">–</span>');
      return '<td class="mitte" style="cursor:pointer" onclick="blattAnsehen(\''+e.id+'\',\''+s.id+'\')">'+z+'</td>';
    }).join('') + '</tr>';
  });
  h += '</tbody></table></div><p class="formhinweis" style="margin-top:10px">Spalte anklicken, um das Blatt zu öffnen. ✓ abgegeben · · begonnen · – nichts eingetragen</p></div>';
  h += '<div class="karte"><h2>Vorschau: so sehen die Blätter für die Schüler aus</h2>'+
    '<p class="sub">Leere Ansicht zum Prüfen – hier wird nichts gespeichert.</p><div class="werkzeuge">'+
    EINHEIT_VORLAGE.filter(([nr]) => blatt(nr)).map(([nr,t]) =>
      '<button class="btn sek klein" onclick="blattVorschau(\''+nr+'\')">'+esc(nrText(nr))+
      (blattGeaendert(nr) ? ' <span class="marke blau" style="margin-left:4px">angepasst</span>' : '')+'</button>').join('')+
    '</div></div>';
  if(schreibDarf()){
    h += '<div class="karte"><h2>Blätter bearbeiten</h2>'+
      '<p class="sub">Fragen umformulieren, ergänzen oder streichen – ohne dass die Datei angefasst werden muss.</p><div class="werkzeuge">'+
      EINHEIT_VORLAGE.filter(([nr]) => blatt(nr)).map(([nr,t]) =>
        '<button class="btn sek klein" onclick="blattBearbeiten(\''+nr+'\')">'+esc(nrText(nr))+'</button>').join('')+
      '</div></div>';
  }
  h += '</section>';
  return h;
}

/* Leere Vorschau eines Arbeitsblatts – zum Prüfen und Überarbeiten */
function blattVorschau(nr){
  const bl = blatt(nr); if(!bl) return;
  let h = '<div class="hinweis">So bekommt der Schüler das Blatt am Tablet zu sehen. Eingaben werden hier nicht gespeichert.</div>';
  bl.felder.forEach(fd => {
    h += '<h3>'+esc(fd.text)+'</h3>' + (fd.hinweis ? '<p class="formhinweis">'+esc(fd.hinweis)+'</p>' : '');
    if(fd.typ === 'tab'){
      h += '<div style="overflow:auto"><table class="liste"><thead><tr><th></th>'+
        fd.spalten.map(c => '<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+
        fd.zeilen.map(z => '<tr><td style="min-width:150px"><b>'+esc(z)+'</b></td>'+
          fd.spalten.map(() => '<td><input disabled></td>').join('')+'</tr>').join('')+'</tbody></table></div>';
    } else if(fd.typ === 'check' || fd.typ === 'wahl'){
      h += fd.opt.map(o => '<label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;'+
        'font-size:14px;color:var(--text);margin-bottom:6px"><input type="'+(fd.typ==='check'?'checkbox':'radio')+
        '" disabled style="width:auto"> '+esc(o)+'</label>').join('');
    } else if(fd.typ === 'foto'){
      h += '<button class="btn sek" disabled>Foto aufnehmen oder auswählen</button>';
    } else if(fd.typ === 'kurz' || fd.typ === 'zahl'){
      h += '<input disabled>';
    } else {
      h += '<textarea disabled></textarea>';
    }
  });
  h += '<div class="hinweis gelb" style="margin-top:18px"><b>Etwas ändern?</b> Die Blätter stehen gesammelt '+
       'im Abschnitt <code>BLAETTER</code> oben in dieser Datei. Kurze Texte kannst du dort direkt anpassen – '+
       'für neue Felder oder andere Fragen sag Bescheid.</div>';
  fenster('Vorschau: ' + bl.titel, h, '<button class="btn sek" onclick="schliesse()">Schließen</button>', 820);
}
function blattAnsehen(eid, sid){

  const bl = blatt(e.nr);

    '<button class="btn sek" onclick="einheitOeffnen(\''+eid+'\')">Zurück</button>');
  const t = D.antw[eid+'_'+sid] || { f:{}, fotos:[] };
  let h = '<div class="hinweis">'+esc(s.vorname+' '+s.nachname)+' · '+esc(nrText(e.nr))+' · '+
    (t.ab ? '<span class="marke gruen">abgegeben</span>' : '<span class="marke gelb">nicht abgegeben</span>')+'</div>';

}
function blattLesen(bl, t){

    h += '<h3>'+esc(fd.text)+'</h3>';

    if(fd.typ === 'tab'){
      h += '<div style="overflow:auto"><table class="liste"><thead><tr><th></th>'+fd.spalten.map(c => '<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';
      fd.zeilen.forEach((z,zi) => { h += '<tr><td><b>'+esc(z)+'</b></td>'+
        fd.spalten.map((c,ci) => '<td>'+esc(((v||{})[zi+'_'+ci]) || '')+'</td>').join('')+'</tr>'; });
      h += '</tbody></table></div>';
    } else if(fd.typ === 'check'){
      h += '<ul style="margin:0 0 10px;padding-left:18px">'+fd.opt.map((o,i) =>
        '<li>'+((v||{})[i] ? '☑ ' : '☐ ')+esc(o)+'</li>').join('')+'</ul>';
    } else if(fd.typ === 'foto'){
      const fo = (t.fotos||[]).filter(x => x.feld === fd.id);
      const mit = fo.map(x => ({ x, u: fotoUrl(x) })).filter(o => o.u);
      h += mit.length ? '<div class="fotos">'+mit.map(o => '<figure><img src="'+esc(o.u)+'" alt=""><figcaption>'+esc(o.x.name||'')+'</figcaption></figure>').join('')+'</div>'
                      : (fo.length ? '<p class="sub">Foto wird geladen …</p>' : '<p class="sub">Kein Foto hochgeladen.</p>');
    } else {
      h += v ? '<p style="white-space:pre-wrap;margin:0 0 10px">'+esc(v)+'</p>' : '<p class="sub">–</p>';
    }
  });
  return h;
}


/* =====================================================================
   Arbeitsblätter bearbeiten
   ===================================================================== */
function blattBearbeiten(nr){
  const bl = blatt(nr); if(!bl) return;
  window._bedit = { nr, titel: bl.titel, felder: JSON.parse(JSON.stringify(bl.felder)) };
  blattEditorZeichnen();
}
function blattEditorZeichnen(){
  const b = window._bedit;
  let h = '<div class="feldreihe"><div class="voll"><label>Überschrift des Blattes</label>'+
    '<input id="beTitel" value="'+esc(b.titel)+'" oninput="window._bedit.titel=this.value"></div></div>';
  h += '<h3>Fragen und Felder</h3>';
  if(!b.felder.length) h += '<p class="sub">Noch keine Felder.</p>';
  h += '<div style="overflow:auto"><table class="liste"><thead><tr><th style="width:40px"></th><th>Beschriftung</th>'+
    '<th style="width:170px">Art</th><th style="width:190px"></th></tr></thead><tbody>';
  b.felder.forEach((f, i) => {
    const art = (FELDTYPEN.find(t => t[0] === f.typ) || ['', f.typ])[1];
    h += '<tr><td class="mitte" style="color:var(--text-hell)">'+(i+1)+'</td>'+
      '<td><b>'+esc(f.text)+'</b>'+(f.hinweis ? '<br><span class="sub">'+esc(f.hinweis)+'</span>' : '')+'</td>'+
      '<td>'+esc(art)+(f.typ === 'tab' ? ' <span class="sub">('+f.zeilen.length+'×'+f.spalten.length+')</span>' : '')+'</td>'+
      '<td style="text-align:right">'+
        '<button class="btn sek klein" onclick="feldSchieben('+i+',-1)" '+(i === 0 ? 'disabled' : '')+'>↑</button> '+
        '<button class="btn sek klein" onclick="feldSchieben('+i+',1)" '+(i === b.felder.length-1 ? 'disabled' : '')+'>↓</button> '+
        '<button class="btn sek klein" onclick="feldBearbeiten('+i+')">Ändern</button> '+
        '<button class="btn sek klein" onclick="feldWeg('+i+')">Löschen</button></td></tr>';
  });
  h += '</tbody></table></div>';
  h += '<div class="werkzeuge" style="margin-top:14px"><button class="btn sek" onclick="feldBearbeiten(-1)">Feld hinzufügen</button>'+
       '<button class="btn sek" onclick="blattVorschauEntwurf()">Vorschau</button></div>';
  h += '<div class="hinweis gelb">Die Antworten der Schüler hängen an der Kennung eines Feldes. '+
       'Beschriftung und Hinweis kannst du jederzeit ändern, ohne dass etwas verloren geht. '+
       'Löschst du ein Feld oder änderst seine Art, werden bereits gegebene Antworten dazu nicht mehr angezeigt.</div>';
  fenster('Arbeitsblatt bearbeiten: ' + nrText(window._bedit.nr), h,
    '<button class="btn sek" onclick="blattZuruecksetzen()">Auf Standard zurücksetzen</button>'+
    '<button class="btn sek" onclick="schliesse()">Abbrechen</button>'+
    '<button class="btn" onclick="blattSichern()">Speichern</button>', 900);
}
function feldSchieben(i, r){
  const f = window._bedit.felder; const z = i + r;
  if(z < 0 || z >= f.length) return;
  const t = f[i]; f[i] = f[z]; f[z] = t; blattEditorZeichnen();
}
function feldWeg(i){
  if(!confirm('Feld „'+window._bedit.felder[i].text+'“ löschen?')) return;
  window._bedit.felder.splice(i, 1); blattEditorZeichnen();
}
function feldBearbeiten(i){
  const neu = i < 0;
  const f = neu ? { id:'f'+uid().slice(-5), typ:'text', text:'', hinweis:'' } : window._bedit.felder[i];
  const zeile = a => (a || []).join('\n');
  let h = '<div class="feldreihe">'+
    '<div class="voll"><label>Beschriftung – die Frage für die Schüler</label><input id="fText" value="'+esc(f.text)+'"></div>'+
    '<div class="voll"><label>Hinweis darunter (freiwillig)</label><input id="fHin" value="'+esc(f.hinweis||'')+'"></div>'+
    '<div class="voll"><label>Art des Feldes</label><select id="fTyp" onchange="feldTypWechsel(this.value)">'+
      FELDTYPEN.map(([w,t]) => '<option value="'+w+'"'+(f.typ===w?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select></div></div>'+
    '<div id="fExtra"></div>';
  window._fedit = { index:i, feld:JSON.parse(JSON.stringify(f)) };
  fenster(neu ? 'Feld hinzufügen' : 'Feld ändern', h,
    '<button class="btn sek" onclick="blattEditorZeichnen()">Zurück</button>'+
    '<button class="btn" onclick="feldSichern()">Übernehmen</button>', 640);
  feldTypWechsel(f.typ);
}
function feldTypWechsel(typ){
  const f = window._fedit.feld; f.typ = typ;
  const box = el('fExtra'); if(!box) return;
  const zeile = a => esc((a || []).join('\n'));
  if(typ === 'wahl' || typ === 'check'){
    box.innerHTML = '<label>Auswahlmöglichkeiten – eine je Zeile</label>'+
      '<textarea id="fOpt" style="min-height:120px">'+zeile(f.opt)+'</textarea>';
  } else if(typ === 'tab'){
    box.innerHTML = '<div class="feldreihe"><div><label>Zeilen – eine je Zeile</label>'+
      '<textarea id="fZeilen" style="min-height:140px">'+zeile(f.zeilen)+'</textarea></div>'+
      '<div><label>Spalten – eine je Zeile</label>'+
      '<textarea id="fSpalten" style="min-height:140px">'+zeile(f.spalten)+'</textarea></div></div>';
  } else box.innerHTML = '';
}
function feldSichern(){
  const w = window._fedit, f = w.feld;
  f.text = el('fText').value.trim();
  f.hinweis = el('fHin').value.trim();
  f.typ = el('fTyp').value;
  if(!f.text) return toast('Bitte eine Beschriftung eintragen');
  const liste = id => (el(id) ? el(id).value.split('\n').map(x => x.trim()).filter(Boolean) : []);
  if(f.typ === 'wahl' || f.typ === 'check'){
    f.opt = liste('fOpt'); delete f.zeilen; delete f.spalten;
    if(f.opt.length < 2) return toast('Bitte mindestens zwei Möglichkeiten eintragen');
  } else if(f.typ === 'tab'){
    f.zeilen = liste('fZeilen'); f.spalten = liste('fSpalten'); delete f.opt;
    if(!f.zeilen.length || !f.spalten.length) return toast('Bitte Zeilen und Spalten eintragen');
  } else { delete f.opt; delete f.zeilen; delete f.spalten; }
  if(w.index < 0) window._bedit.felder.push(f); else window._bedit.felder[w.index] = f;
  blattEditorZeichnen();
}
function blattVorschauEntwurf(){
  const b = window._bedit;
  const alt = D.blaetter[b.nr];
  D.blaetter[b.nr] = { nr:b.nr, titel:b.titel, felder:b.felder };   // nur zur Anzeige
  blattVorschau(b.nr);
  if(alt) D.blaetter[b.nr] = alt; else delete D.blaetter[b.nr];
}
function blattSichern(){
  const b = window._bedit;
  if(!b.felder.length) return toast('Das Blatt braucht mindestens ein Feld');
  schreibe([['set','blaetter', b.nr, { nr:b.nr, titel:b.titel.trim() || nrText(b.nr), felder:b.felder,
    geaendert:new Date().toISOString() }]]).then(() => { schliesse(); toast('Arbeitsblatt gespeichert'); });
}
function blattZuruecksetzen(){
  const b = window._bedit;
  if(!BLAETTER[b.nr]) return toast('Für diese Einheit gibt es kein eingebautes Blatt');
  if(!confirm('Alle Änderungen an diesem Blatt verwerfen und die eingebaute Fassung wiederherstellen?')) return;
  schreibe([['del','blaetter', b.nr]]).then(() => { schliesse(); toast('Zurückgesetzt'); });
}

/* ---------- Jahresmatrix ---------- */
function ansMatrix(g){
  if(!g) return leerHinweis('Keine Gruppe', 'Lege zuerst eine Gruppe an.');
  const sch = schuelerDer(g.id), eh = einheitenDer(g.id);
  let h = '<section><h1>Jahresmatrix</h1><p class="sub">Entwicklung über das Schuljahr · '+esc(g.name)+'</p>';
  if(!sch.length) return h + leerHinweis('Keine Schüler','Trage die Schüler unter <b>Gruppen</b> ein.') + '</section>';
  h += '<div class="werkzeuge"><label style="margin:0">Schüler</label><select id="matSch" onchange="alles()" style="width:auto">'+
    sch.map(s => '<option value="'+s.id+'"'+(window._matSch===s.id?' selected':'')+'>'+esc(s.vorname+' '+s.nachname)+'</option>').join('')+
    '</select><button class="btn sek" onclick="window.print()">Drucken</button></div>';
  const sid = (el('matSch') && el('matSch').value) || window._matSch || sch[0].id;
  window._matSch = sid;
  const s = D.schueler[sid] || sch[0];
  h += '<div class="karte"><h2>'+esc(s.vorname+' '+s.nachname)+'</h2>'+
    '<p class="sub">'+esc(g.name)+' · '+esc(g.schule||'')+' · '+esc(g.schuljahr||'')+'</p>'+
    '<div style="overflow:auto"><table class="liste"><thead><tr><th style="min-width:230px">Kriterium</th>'+
    eh.map(e => '<th class="mitte" title="'+esc(e.titel)+'">'+esc(String(e.nr))+'</th>').join('')+'<th class="mitte">Trend</th></tr></thead><tbody>';
  KRITERIEN.forEach(([bereich, items]) => {
    h += '<tr class="bereichzeile"><td colspan="'+(eh.length+2)+'">'+esc(bereich)+'</td></tr>';
    items.forEach(([kid, txt]) => {
      const werte = eh.map(e => ((D.bew[e.id+'_'+s.id]||{}).w||{})[kid] || 0);
      const mit = werte.filter(Boolean);
      const ers = mit[0], letz = mit[mit.length-1];
      const trend = mit.length < 2 ? '' : (letz < ers ? '<span class="marke gruen">↑</span>' : letz > ers ? '<span class="marke rot">↓</span>' : '<span class="marke grau">→</span>');
      h += '<tr><td>'+esc(txt)+'</td>'+werte.map(v => '<td class="mitte"><span class="matrixzelle m'+v+'">'+(v?SKALA[v-1][1]:'–')+'</span></td>').join('')+
           '<td class="mitte">'+trend+'</td></tr>';
    });
  });
  h += '</tbody></table></div>';
  h += '<p class="formhinweis" style="margin-top:10px">'+SKALA.map(([n,z,t]) => '<span class="matrixzelle m'+n+'">'+z+'</span> '+esc(t)).join(' &nbsp; ')+'</p>';
  const freie = eh.filter(e => e.status === 'frei');
  if(freie.length){
    h += '<h2>Rückmeldungen</h2>';
    freie.forEach(e => { const b = D.bew[e.id+'_'+s.id] || {};
      if(b.bem || b.pos || b.next) h += '<div class="hinweis"><b>'+esc(nrText(e.nr))+'</b> · '+datumDe(e.datum)+
        (b.pos?'<br>Positiv: '+esc(b.pos):'')+(b.next?'<br>Daran arbeiten wir: '+esc(b.next):'')+(b.bem?'<br>'+esc(b.bem):'')+'</div>'; });
  }
  return h + '</div></section>';
}

/* ---------- Gruppen und Schüler ---------- */
function ansGruppen(){
  const gr = Object.values(D.gruppen).sort((a,b) => (b.schuljahr||'').localeCompare(a.schuljahr||'') || (a.name||'').localeCompare(b.name||''));
  let h = '<section><h1>Gruppen und Schüler</h1><p class="sub">Mehrere Gruppen und Schuljahre nebeneinander</p>'+
    '<div class="werkzeuge"><button class="btn" onclick="gruppeNeu()">Gruppe anlegen</button></div>';
  if(!gr.length) return h + leerHinweis('Noch keine Gruppe', 'Lege deine erste Gruppe an, zum Beispiel „8.3.1“ der Realschule Bobingen für das Schuljahr 2026/27.') + '</section>';
  gr.forEach(g => {
    const sch = schuelerDer(g.id);
    h += '<div class="karte"><div class="werkzeuge"><h2 style="margin:0">'+esc(g.name)+'</h2>'+
      '<span class="marke grau">'+esc(g.schule||'')+'</span><span class="marke blau">'+esc(g.schuljahr||'')+'</span>'+
      '<span style="margin-left:auto"></span><button class="btn sek klein" onclick="schuelerNeu(\''+g.id+'\')">Schüler hinzufügen</button>'+
      '<button class="btn sek klein" onclick="gruppeNeu(\''+g.id+'\')">Bearbeiten</button>'+
      '<button class="btn sek klein" onclick="gruppeWeg(\''+g.id+'\')">Löschen</button></div>';
    if(!sch.length) h += '<p class="sub">Noch keine Schüler.</p>';
    else {
      h += '<div style="overflow:auto"><table class="liste"><thead><tr><th>Name</th><th>Klasse</th><th class="mitte">PIN</th><th>Einsichtscode</th><th style="width:220px"></th></tr></thead><tbody>';
      sch.forEach(s => h += '<tr><td><b>'+esc(s.vorname+' '+s.nachname)+'</b></td><td>'+esc(s.klasse||'')+'</td>'+
        '<td class="mitte"><code>'+esc(s.pin||'')+'</code></td><td><code style="font-size:12px">'+esc(s.code||'')+'</code></td>'+
        '<td style="text-align:right"><button class="btn sek klein" onclick="codeZettel(\''+s.id+'\')">Zettel</button> '+
        '<button class="btn sek klein" onclick="schuelerNeu(\''+g.id+'\',\''+s.id+'\')">Bearbeiten</button> '+
        '<button class="btn sek klein" onclick="schuelerWeg(\''+s.id+'\')">Löschen</button></td></tr>');
      h += '</tbody></table></div>';
    }
    h += '</div>';
  });
  return h + '</section>';
}
function gruppeNeu(id){
  const g = id ? D.gruppen[id] : { name:'', schule:'', schuljahr:'', jahrgang:8 };
  fenster(id ? 'Gruppe bearbeiten' : 'Gruppe anlegen',
    '<div class="feldreihe"><div><label>Name der Gruppe</label><input id="gName" value="'+esc(g.name||'')+'" placeholder="8.3.1"></div>'+
    '<div><label>Schule</label><input id="gSchule" value="'+esc(g.schule||'')+'" placeholder="Realschule Bobingen"></div>'+
    '<div><label>Schuljahr</label><input id="gJahr" value="'+esc(g.schuljahr||'')+'" placeholder="2026/27"></div>'+
    '<div><label>Jahrgangsstufe</label><input id="gStufe" type="number" value="'+esc(g.jahrgang||8)+'"></div></div>',
    '<button class="btn sek" onclick="schliesse()">Abbrechen</button><button class="btn" onclick="gruppeSpeichern(\''+(id||'')+'\')">Speichern</button>');
}
function gruppeSpeichern(id){
  const n = el('gName').value.trim(); if(!n) return toast('Bitte einen Namen eintragen');
  const gid = id || uid();
  schreibe([['set','gruppen',gid,{ id:gid, name:n, schule:el('gSchule').value.trim(),
    schuljahr:el('gJahr').value.trim(), jahrgang:Number(el('gStufe').value)||8 }]])
    .then(() => { aktGruppe = gid; schliesse(); toast('Gespeichert'); });
}
function gruppeWeg(id){
  const sch = schuelerDer(id);
  if(!confirm('Gruppe löschen?' + (sch.length ? '\n\nAchtung: ' + sch.length + ' Schüler und alle Bewertungen dieser Gruppe werden mit gelöscht.' : ''))) return;
  const ops = [['del','gruppen',id]];
  sch.forEach(s => { ops.push(['del','schueler',s.id]); if(s.code) ops.push(['del','einsicht',s.code]); });
  einheitenDer(id).forEach(e => { ops.push(['del','einheiten',e.id]);
    sch.forEach(s => { ops.push(['del','anw',e.id+'_'+s.id],['del','bew',e.id+'_'+s.id],['del','antw',e.id+'_'+s.id]); }); });
  schreibe(ops).then(() => toast('Gruppe gelöscht'));
}
function schuelerNeu(gid, sid){
  const s = sid ? D.schueler[sid] : { vorname:'', nachname:'', klasse:'', pin:'', code:'' };
  fenster(sid ? 'Schüler bearbeiten' : 'Schüler hinzufügen',
    '<div class="feldreihe"><div><label>Vorname</label><input id="sVor" value="'+esc(s.vorname||'')+'"></div>'+
    '<div><label>Nachname</label><input id="sNach" value="'+esc(s.nachname||'')+'"></div>'+
    '<div><label>Klasse</label><input id="sKlasse" value="'+esc(s.klasse||'')+'" placeholder="8a"></div>'+
    '<div><label>PIN für das Tablet (4 Ziffern)</label>'+
      '<div style="display:flex;gap:6px"><input id="sPin" maxlength="4" inputmode="numeric" value="'+esc(s.pin||'')+'" placeholder="wird erzeugt">'+
      '<button class="btn sek klein" style="white-space:nowrap" onclick="pinWuerfeln()">Neue PIN</button></div></div></div>'+
    '<p class="formhinweis">Mit der PIN meldet sich der Schüler am Gruppen-Tablet an. '+
    (sid ? 'Wird das Feld leer gelassen, bleibt die bisherige PIN bestehen. ' : '')+
    'Der Einsichtscode für Schüler und Eltern wird einmalig erzeugt und ändert sich nicht.</p>',
    '<button class="btn sek" onclick="schliesse()">Abbrechen</button><button class="btn" onclick="schuelerSpeichern(\''+gid+'\',\''+(sid||'')+'\')">Speichern</button>');
}
function schuelerSpeichern(gid, sid){
  const v = el('sVor').value.trim(), n = el('sNach').value.trim();
  if(!v || !n) return toast('Bitte Vor- und Nachname eintragen');
  const alt = sid ? D.schueler[sid] : null;
  const id = sid || uid();
  let pin = el('sPin').value.replace(/\D/g,'').slice(0,4);
  if(pin.length !== 4) pin = (alt && alt.pin) ? alt.pin : String(Math.floor(1000 + Math.random()*9000));
  const o = { id, gid, vorname:v, nachname:n, klasse:el('sKlasse').value.trim(), pin,
    code:(alt && alt.code) || neuerCode(8), aktiv:true };
  schreibe([['set','schueler',id,o]]).then(() => { schliesse(); toast('Gespeichert'); });
}
function pinWuerfeln(){ el('sPin').value = String(Math.floor(1000 + Math.random()*9000)); }
function schuelerWeg(sid){
  const s = D.schueler[sid]; if(!s) return;
  if(!confirm('„'+s.vorname+' '+s.nachname+'“ löschen?\n\nAlle Bewertungen und Arbeitsblätter dieses Schülers werden mit gelöscht.')) return;
  const ops = [['del','schueler',sid]]; if(s.code) ops.push(['del','einsicht',s.code]);
  einheitenDer(s.gid).forEach(e => ops.push(['del','anw',e.id+'_'+sid],['del','bew',e.id+'_'+sid],['del','antw',e.id+'_'+sid]));
  schreibe(ops).then(() => toast('Gelöscht'));
}
function codeZettel(sid){
  const s = D.schueler[sid]; if(!s) return;
  const g = D.gruppen[s.gid] || {};
  const basis = (einst().url || (location.protocol === 'https:' ? location.origin + location.pathname : '')).split('#')[0];
  const url = basis ? basis + '#e=' + s.code : '';
  fenster('Zugangszettel',
    '<div id="zettel" style="border:2px dashed var(--grau-linie);border-radius:10px;padding:22px">'+
    '<img src="'+LOGO+'" style="height:30px"><h2 style="margin:12px 0 2px">Einsicht in die Technik-AG</h2>'+
    '<p class="sub">'+esc(s.vorname+' '+s.nachname)+' · '+esc(g.name||'')+(g.schule?' · '+esc(g.schule):'')+'</p>'+
    '<div style="display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;margin-top:14px">'+
      '<div style="flex:1;min-width:260px">'+
        '<p style="margin:0 0 10px">Hier könnt ihr jederzeit sehen, was in der AG gemacht wurde, '+
        'welche Arbeitsblätter ausgefüllt wurden und wie die Rückmeldung ausfällt:</p>'+
        (url ? '<p style="font-size:14px;word-break:break-all;margin:0 0 10px"><b>'+esc(url)+'</b></p>'
             : '<div class="hinweis rot" style="margin:0 0 10px">Es ist noch keine Adresse der Seite hinterlegt. '+
               'Trage sie unter <b>Einstellungen → Allgemein</b> ein, dann enthält der Zettel Link und QR-Code.</div>')+
        '<p style="margin:0 0 6px">Persönlicher Zugangscode</p>'+
        '<p style="margin:0;font-size:26px;letter-spacing:3px;font-weight:700;color:var(--blau-dunkel)">'+esc(s.code)+'</p>'+
      '</div>'+
      (url ? '<div style="text-align:center">'+qrSvg(url, 42)+
             '<p class="formhinweis" style="margin:4px 0 0;text-align:center">Mit der Handykamera scannen</p></div>' : '')+
    '</div>'+
    '<p class="formhinweis" style="margin-top:16px">Bitte nicht weitergeben – wer den Code hat, sieht die Rückmeldungen.</p>'+
    (schreibDarf() ? '<p class="formhinweis" style="margin:0">PIN für das Tablet in der AG: <b>'+esc(s.pin)+'</b></p>' : '')+'</div>',
    '<button class="btn sek" onclick="schliesse()">Schließen</button><button class="btn" onclick="window.print()">Drucken</button>', 680);
}
</script>

<script>
/* ---------- Einstellungen ---------- */
const einst = () => D.einst.app || {};
function ansEinstellungen(){
  const e = einst();
  const ben = Object.values(D.benutzer);
  let h = '<section><h1>Einstellungen</h1><p class="sub">Zugänge, Einrichtung und Datensicherung</p>';

    '<div class="voll"><label>Adresse dieser Seite (für die Zugangszettel)</label><input id="stUrl" value="'+esc(e.url||'')+'" placeholder="https://deinname.github.io/technik-ag/"></div>'+
    '</div><button class="btn" onclick="einstSpeichern()">Speichern</button></div>';

function benutzerAnlegen(){
  const mail = el('bnMail').value.trim().toLowerCase(), name = el('bnName').value.trim(), r = el('bnRolle').value, pass = el('bnPass').value;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return toast('Bitte eine gültige E-Mail eintragen');
  const eintragen = () => schreibe([['set','benutzer',mail,{ mail, name, rolle:r, gruppen:[] }]]).then(() => {
    el('bnMail').value = ''; el('bnName').value = ''; el('bnPass').value = ''; toast('Zugang angelegt'); });
  if(!cloudAktiv || !pass) return eintragen();
  let zweit; try { zweit = firebase.app('zweit'); } catch(e){ zweit = firebase.initializeApp(FIREBASE_KONFIG, 'zweit'); }
  zweit.auth().createUserWithEmailAndPassword(mail, pass).then(() => { zweit.auth().signOut(); return eintragen(); })
    .catch(e => { if(e.code === 'auth/email-already-in-use'){ eintragen(); return; }
      el('bnStatus').innerHTML = '<div class="hinweis rot">Fehlgeschlagen: '+esc(e.code)+'</div>'; });
}
function sicherung(){
  const b = new Blob([JSON.stringify(D, null, 1)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b);
  a.download = 'technik-ag-sicherung-' + heute() + '.json'; a.click();

function sicherungLaden(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try { const o = JSON.parse(r.result);
      if(!confirm('Sicherung einspielen? Die aktuellen Daten in dieser Ansicht werden ersetzt.')) return;
      Object.keys(D).forEach(k => D[k] = o[k] || {}); lokalSpeichern(); alles(); toast('Eingespielt');
    } catch(e){ toast('Datei konnte nicht gelesen werden'); } };
  r.readAsText(f); inp.value = '';
}

/* ---------- Selbsttest für Rechte und Regeln ---------- */
function rechtePruefen(){
  const box = el('pruefErgebnis');
  if(!cloudAktiv) return box.innerHTML = '<div class="hinweis gelb">Lokaler Testmodus – es gibt keine Firebase-Regeln zu prüfen.</div>';
  box.innerHTML = '<p class="sub">Prüfung läuft …</p>';
  const mein = D.benutzer[meineMail];
  const zeilen = [];
  zeilen.push(['Anmeldung', meineMail ? 'ok' : 'fehlt', meineMail || '–']);
  zeilen.push(['Eintrag in „benutzer“', mein ? 'ok' : 'fehlt',
    mein ? 'Dokument-ID: ' + meineMail : 'Kein Dokument mit der ID „' + meineMail + '“ – Groß- und Kleinschreibung beachten']);
  zeilen.push(['Feld „rolle“', (mein && mein.rolle === 'dozent') ? 'ok' : 'prüfen',
    mein ? 'steht auf „' + mein.rolle + '“' + (mein.rolle === 'dozent' ? '' : ' – für volle Rechte muss hier genau dozent stehen') : '–']);

  const sammlungen = ['gruppen','schueler','einheiten','anw','bew','antw','fotos','blaetter','einst','einsicht'];
  const schritte = sammlungen.map(c => {
    const ref = db.collection(c).doc('_pruefung');
    return ref.set({ pruefung:true, zeit:new Date().toISOString() })
      .then(() => ref.delete().catch(() => {}))
      .then(() => ['Schreiben in „' + c + '“', 'ok', ''])
      .catch(e => ['Schreiben in „' + c + '“', 'fehlt', kurzFehler(e)]);
  });
  Promise.all(schritte).then(erg => {
    const alle = zeilen.concat(erg);
    const problem = alle.filter(z => z[1] !== 'ok');
    let h = '<div style="overflow:auto"><table class="liste"><thead><tr><th>Prüfung</th><th style="width:90px">Ergebnis</th><th>Hinweis</th></tr></thead><tbody>'+
      alle.map(z => '<tr><td>'+esc(z[0])+'</td><td><span class="marke '+(z[1]==='ok'?'gruen':'rot')+'">'+esc(z[1])+'</span></td><td>'+esc(z[2])+'</td></tr>').join('')+
      '</tbody></table></div>';
    if(!problem.length) h += '<div class="hinweis gruen" style="margin-top:12px">Alles in Ordnung – Lesen und Schreiben funktionieren.</div>';
    else if(problem.some(z => z[0].indexOf('Schreiben') === 0))
      h += '<div class="hinweis rot" style="margin-top:12px"><b>Die Regeln in Firebase passen noch nicht zur App.</b> '+
           'Am häufigsten fehlt der Abschnitt für eine Sammlung, meist <code>fotos</code>. Kopiere die Regeln unten vollständig '+
           'in die Firebase-Konsole unter Firestore Database → Regeln und klicke auf <b>Veröffentlichen</b>. '+
           'Danach diese Seite neu laden und noch einmal prüfen.</div>';
    box.innerHTML = h;
  });
}
function kurzFehler(e){
  const c = (e && e.code) || '';
  if(c.indexOf('permission-denied') > -1) return 'Die Regel erlaubt das Schreiben nicht.';
  if(c.indexOf('unavailable') > -1) return 'Keine Verbindung zum Server.';
  return c || (e && e.message) || 'unbekannter Fehler';
}

const REGELN_FS = `rules_version = '2';
service cloud.firestore {
  match /databases/{datenbank}/documents {
    function mail()  { return request.auth.token.email.lower(); }
    function ich()   { return get(/databases/$(datenbank)/documents/benutzer/$(mail())).data; }
    function drin()  { return request.auth != null
                       && exists(/databases/$(datenbank)/documents/benutzer/$(mail())); }
    function dozent(){ return drin() && ich().rolle == 'dozent'; }
    function tablet(){ return drin() && ich().rolle == 'tablet'; }

    // Zugaenge: jeder sieht seinen eigenen Eintrag, Dozent verwaltet alle
    match /benutzer/{m} {
      allow read:  if request.auth != null && (m == mail() || drin());
      allow write: if dozent();
    }
    // Stammdaten und Bewertung: Dozent schreibt, angemeldete Nutzer lesen
    match /gruppen/{d}   { allow read: if drin(); allow write: if dozent(); }
    match /schueler/{d}  { allow read: if drin(); allow write: if dozent(); }
    match /einheiten/{d} { allow read: if drin(); allow write: if dozent(); }
    match /anw/{d}       { allow read: if drin(); allow write: if dozent(); }
    match /bew/{d}       { allow read: if drin(); allow write: if dozent(); }
    match /einst/{d}     { allow read: if drin(); allow write: if dozent(); }
    // Arbeitsblaetter: auch das Gruppen-Tablet darf schreiben
    match /antw/{d}      { allow read: if drin(); allow write: if dozent() || tablet(); }
    // Arbeitsblaetter: auch ohne Anmeldung lesbar, damit die Einsicht sie anzeigen kann
    match /blaetter/{d}  { allow read: if true; allow write: if dozent(); }
    // Fotos: einzeln abrufbar, wenn man die Kennung kennt – auflisten nur intern
    match /fotos/{id}      { allow get: if true; allow list: if drin();
                             allow write: if dozent() || tablet(); }
    // Einsicht fuer Eltern und Schueler: lesbar mit dem Code, schreibbar nur vom Dozenten
    match /einsicht/{code} { allow read: if true; allow write: if dozent(); }
  }
}`;

function blattSetzen(id, v){ window._blatt.f[id] = v; }
function blattTab(id, z, c, v){ const b = window._blatt; b.f[id] = b.f[id] || {}; b.f[id][z+'_'+c] = v; }
function blattCheck(id, i, an){ const b = window._blatt; b.f[id] = b.f[id] || {}; b.f[id][i] = an; }
function fotoListe(feld){
  const fo = (window._blatt.fotos || []).filter(x => x.feld === feld);
  return fo.length ? '<div class="fotos">'+fo.map((x,i) => '<figure><img src="'+esc(fotoUrl(x))+'" alt="">'+
    '<figcaption><button class="btn sek klein" onclick="fotoWeg(\''+esc(feld)+'\','+i+')">Entfernen</button></figcaption></figure>').join('')+'</div>' : '';
}
function fotoWeg(feld, i){
  const b = window._blatt; const liste = b.fotos.filter(x => x.feld === feld);
  const w = liste[i]; b.fotos = b.fotos.filter(x => x !== w);
  el('fotoBox_'+feld).innerHTML = fotoListe(feld);
}
function fotoWaehlen(feld, inp){
  const f = inp.files[0]; if(!f) return; inp.value = '';
  if(f.size > 12 * 1024 * 1024) return toast('Das Bild ist zu groß');
  toast('Foto wird verarbeitet …');
  verkleinern(f).then(datenUrl => {
    const b = window._blatt;
    const id = uid();
    const eintrag = { feld, id, name:f.name };
    const doku = { id, eid:b.eid, sid:b.sid, feld, name:f.name, d:datenUrl, stand:new Date().toISOString() };
    schreibe([['set','fotos', id, doku]]).then(() => {
      D.fotos[id] = doku;                       // sofort anzeigen, ohne auf den Server zu warten
      b.fotos.push(eintrag);
      el('fotoBox_'+feld).innerHTML = fotoListe(feld);
      blattSpeichern(false, true);
      toast('Foto gespeichert');
    }).catch(() => toast('Das Foto konnte nicht gespeichert werden'));
  });
}
/* Bild verkleinern und als Daten-Adresse zurückgeben.
   Firestore erlaubt rund 1 MB je Dokument – deshalb notfalls mehrfach verkleinern. */
function verkleinern(datei){
  return new Promise(res => {
    const img = new Image(); const u = URL.createObjectURL(datei);
    img.onload = () => {
      URL.revokeObjectURL(u);
      const versuche = [[1200,0.72],[900,0.66],[700,0.6],[520,0.55]];
      let erg = '';
      for(const [max, q] of versuche){
        let w = img.width, h = img.height;
        if(Math.max(w,h) > max){ const f = max / Math.max(w,h); w = Math.round(w*f); h = Math.round(h*f); }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        erg = c.toDataURL('image/jpeg', q);
        if(erg.length < 850000) break;
      }
      res(erg);
    };
    img.onerror = () => res('');
    img.src = u;
  });
}
function blattSpeichern(abgeben, still){
  const b = window._blatt; if(!b) return;
  if(abgeben && !confirm('Arbeitsblatt abgeben?\n\nDanach kannst du es nicht mehr selbst ändern.')) return;
  schreibe([['set','antw', b.eid+'_'+b.sid, { eid:b.eid, sid:b.sid, f:b.f, fotos:b.fotos, ab:!!abgeben, stand:new Date().toISOString() }]])
    .then(() => { if(still) return; toast(abgeben ? 'Abgegeben – gut gemacht' : 'Gespeichert'); schuelerAnsicht(); });
}

/* =====================================================================
   Eltern- und Schülereinsicht über den Code (ohne Anmeldung)
   ===================================================================== */
function elternStart(code){
  elternModus = true; elternCode = code;
  el('navi').innerHTML = ''; el('gruppenWahl').style.display = 'none';
  el('haupt').innerHTML = '<section><div class="karte"><p class="sub">Einsicht wird geladen …</p></div></section>';
  if(cloudAktiv){
    db.collection('einsicht').doc(code).get()
      .then(d => { elternDaten = d.exists ? d.data() : null; return elternBlaetterLaden(); })
      .then(() => elternFotosLaden())
      .then(() => elternSeite())
      .catch(() => { elternDaten = null; elternSeite(); });
  } else { elternDaten = D.einsicht[code] || null; elternFotos = D.fotos; elternSeite(); }
}
/* Angepasste Arbeitsblätter auch ohne Anmeldung laden */
function elternBlaetterLaden(){
  return db.collection('blaetter').get()
    .then(s => { const o = {}; s.forEach(d => o[d.id] = d.data()); D.blaetter = o; })
    .catch(() => {});
}
/* Die Fotos der freigegebenen Einheiten einzeln nachladen */
function elternFotosLaden(){
  if(!elternDaten) return Promise.resolve();
  const ids = [];
  (elternDaten.einheiten || []).forEach(e => (e.fotos || []).forEach(f => { if(f.id && !elternFotos[f.id]) ids.push(f.id); }));
  if(!ids.length) return Promise.resolve();
  return Promise.all(ids.slice(0, 60).map(id =>
    db.collection('fotos').doc(id).get().then(d => { if(d.exists) elternFotos[id] = d.data(); }).catch(() => {})));
}
function elternSeite(){
  const d = elternDaten;
  if(!d) return el('haupt').innerHTML = '<section><div class="karte"><div class="leerzustand">'+
    '<b>Kein Zugang gefunden</b><p>Der Code stimmt nicht oder es wurde noch keine Einheit freigegeben. Bitte den Zugangszettel prüfen.</p></div></div></section>';
  let h = '<section><h1>'+esc(d.name)+'</h1><p class="sub">'+esc(d.gruppe||'')+(d.schule?' · '+esc(d.schule):'')+(d.schuljahr?' · '+esc(d.schuljahr):'')+'</p>';
  const eh = d.einheiten || [];
  const da = eh.filter(e => e.anwesend === 'da').length;
  const heuteStr = heute();
  const geplant = (d.termine || []).slice().sort((a,b) => String(a.datum).localeCompare(String(b.datum)));
  const kommend = geplant.filter(t => t.datum >= heuteStr);
  h += '<div class="kennzahlen">'+kz(eh.length,'abgeschlossene Einheiten')+kz(da+' / '+eh.length,'anwesend','gruen')+
    (kommend.length ? kz(datumDe(kommend[0].datum),'nächster Termin','blau') : '')+'</div>';

  if(geplant.length){
    h += '<div class="karte"><h2>Geplante Einheiten</h2>'+
      '<div style="overflow:auto"><table class="liste"><thead><tr><th style="width:120px">Datum</th><th style="width:150px">Einheit</th>'+
      '<th>Thema</th><th style="width:150px"></th></tr></thead><tbody>'+
      geplant.map(t => {
        const vorbei = t.datum < heuteStr;
        const naechster = (!vorbei && kommend.length && t.datum === kommend[0].datum);
        return '<tr'+(naechster ? ' style="background:var(--blau-hell)"' : '')+'>'+
          '<td><b>'+datumDe(t.datum)+'</b></td><td>'+esc(nrText(t.nr))+'</td><td>'+esc(t.titel||'')+'</td>'+
          '<td>'+(naechster ? '<span class="marke blau">als Nächstes</span>'
                 : vorbei ? '<span class="marke grau">Rückmeldung folgt</span>' : '')+'</td></tr>';
      }).join('')+
      '</tbody></table></div>'+
      '<p class="formhinweis" style="margin-top:10px">Termine können sich kurzfristig ändern – maßgeblich ist die Information über die Schule. '+
      'Zu Einheiten, die schon stattgefunden haben, erscheint die Rückmeldung, sobald sie abgeschlossen ist.</p></div>';
  }
  if(!eh.length) return el('haupt').innerHTML = h +
    leerHinweis('Noch nichts freigegeben','Sobald die erste Einheit abgeschlossen und freigegeben ist, erscheint sie hier mit Rückmeldung und Arbeitsblatt.') + '</section>';

  h += '<div class="karte"><h2>Bewertung über das Jahr</h2><div style="overflow:auto"><table class="liste"><thead><tr><th style="min-width:220px">Kriterium</th>'+
    eh.map(e => '<th class="mitte" title="'+esc(e.titel||'')+'">'+esc(String(e.nr))+'</th>').join('')+'</tr></thead><tbody>';
  KRITERIEN.forEach(([bereich, items]) => {
    h += '<tr class="bereichzeile"><td colspan="'+(eh.length+1)+'">'+esc(bereich)+'</td></tr>';
    items.forEach(([kid, txt]) => {
      h += '<tr><td>'+esc(txt)+'</td>'+eh.map(e => { const v = (e.bew||{})[kid] || 0;
        return '<td class="mitte"><span class="matrixzelle m'+v+'">'+(v?SKALA[v-1][1]:'–')+'</span></td>'; }).join('')+'</tr>';
    });
  });
  h += '</tbody></table></div><p class="formhinweis" style="margin-top:10px">'+
    SKALA.map(([n,z,t]) => '<span class="matrixzelle m'+n+'">'+z+'</span> '+esc(t)).join(' &nbsp; ')+
    '</p><p class="formhinweis">Die Bewertung ist eine Beobachtung aus der AG, keine Schulnote. Sie soll zeigen, wo die Stärken liegen und woran gearbeitet wird.</p></div>';

  eh.forEach(e => {
    h += '<div class="karte"><div class="werkzeuge"><h2 style="margin:0">'+esc(nrText(e.nr))+'</h2>'+
      '<span class="marke grau">'+datumDe(e.datum)+'</span>'+
      (e.anwesend === 'da' ? '<span class="marke gruen">war dabei</span>' : e.anwesend ? '<span class="marke gelb">gefehlt</span>' : '')+'</div>'+
      '<p class="sub">'+esc(e.titel||'')+'</p>';
    if(e.pos)  h += '<div class="hinweis gruen"><b>Positiv aufgefallen:</b> '+esc(e.pos)+'</div>';
    if(e.next) h += '<div class="hinweis gelb"><b>Daran arbeiten wir:</b> '+esc(e.next)+'</div>';
    if(e.bem)  h += '<div class="hinweis">'+esc(e.bem)+'</div>';
    const bl = blatt(e.nr);
    if(bl && (Object.keys(e.antworten||{}).length || (e.fotos||[]).length)){
      h += '<h3>Arbeitsblatt</h3>' + blattLesen(bl, { f:e.antworten, fotos:e.fotos });
    }
    h += '</div>';
  });
  h += '<p class="formhinweis">Stand: '+esc(new Date(d.aktualisiert||Date.now()).toLocaleString('de-DE'))+'</p>';
  el('haupt').innerHTML = h + '</section>';
  el('topBenutzer').textContent = 'Einsicht';
}
</script>

function demoJahr(){
  if(Object.values(D.gruppen).some(g => String(g.id).indexOf('demo_') === 0)){
    if(!confirm('Es gibt bereits ein Demo-Jahr. Soll es neu aufgebaut werden?')) return;
  }
  const gid = 'demo_g2526';
  const ops = [['set','gruppen',gid,{ id:gid, name:'8.3.1 (Beispiel)', schule:'Mittelschule Bobingen', schuljahr:'2025/26', jahrgang:8 }]];

  const sids = DEMO_SCHUELER.map(([v,n,kl], i) => {
    const id = 'demo_s' + i;
    ops.push(['set','schueler',id,{ id, gid, vorname:v, nachname:n, klasse:kl,
      pin:String(1234 + i*111).slice(0,4), code:'DEMO' + String(i+1) + 'XY' + (i+3), aktiv:true }]);
    return id;
  });

  /* Termine: alle zwei Wochen ab Ende September 2025 */
  const start = new Date(2025, 8, 23);
  const eids = EINHEIT_VORLAGE.map(([nr, titel], i) => {
    const d = new Date(start); d.setDate(d.getDate() + i * 21);
    const id = 'demo_e' + nr;
    ops.push(['set','einheiten',id,{ id, gid, nr, titel,
      datum: d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),
      status:'frei' }]);
    return { id, nr };
  });

  const begrenze = x => Math.max(1, Math.min(5, Math.round(x)));
  eids.forEach((e, ei) => {
    const anteil = ei / (eids.length - 1);           // 0 am Anfang, 1 am Ende
    sids.forEach((sid, si) => {
      const prof = DEMO_SCHUELER[si][3];
      /* Zwei Fehltage im Jahr, damit die Anwesenheit echt wirkt */
      const fehlt = (si === 2 && ei === 1) || (si === 4 && ei === 6);
      ops.push(['set','anw', e.id+'_'+sid, { eid:e.id, sid, status: fehlt ? 'ent' : 'da' }]);
      if(fehlt) return;

      const w = {};
      ALLE_KRIT.forEach(([kid], ki) => {
        const [start0, delta] = prof[DEMO_BEREICH[kid]];
        const schwankung = ((si + ki + ei) % 3) * 0.35 - 0.35;
        w[kid] = begrenze(start0 + delta * anteil + schwankung);
      });
      const t = DEMO_TEXTE[e.nr] || ['','',''];
      ops.push(['set','bew', e.id+'_'+sid, { eid:e.id, sid, w,
        pos: t[0], next: t[1], bem: (si % 3 === 0 ? t[2] : ''), sp: (si === ei % 6 || si === (ei+1) % 6) }]);

      const fotos = [];
      if(e.nr === '1' && si % 2 === 0) fotos.push({ feld:'foto', id:'demo_f1', name:'fahrzeug.jpg' });
      if(e.nr === '5' && si % 2 === 1) fotos.push({ feld:'foto', id:'demo_f2', name:'greifer.jpg' });
      if(e.nr === '7' && si === 0)     fotos.push({ feld:'foto', id:'demo_f2', name:'skizze.jpg' });
      ops.push(['set','antw', e.id+'_'+sid, { eid:e.id, sid, ab:true, fotos,
        f: demoAntwort(e.nr, si, DEMO_SCHUELER[si][0]), stand:new Date().toISOString() }]);
    });
  });

  ops.push(['set','fotos','demo_f1',{ id:'demo_f1', eid:'demo_e1', sid:'demo_s0', feld:'foto', name:'fahrzeug.jpg', d:DEMO_FOTO1 }]);
  ops.push(['set','fotos','demo_f2',{ id:'demo_f2', eid:'demo_e5', sid:'demo_s1', feld:'foto', name:'greifer.jpg', d:DEMO_FOTO2 }]);

  schreibe(ops).then(() => { aktGruppe = gid; schliesse(); alles();
    toast('Demo-Jahr 2025/26 angelegt'); });
}

function demoWeg(){
  const treffer = [];
  ['gruppen','schueler','einheiten','anw','bew','antw','fotos'].forEach(c =>
    Object.keys(D[c] || {}).forEach(id => { if(id.indexOf('demo_') === 0 || String(id).indexOf('_demo_') > -1) treffer.push(['del', c, id]); }));
  Object.values(D.schueler).forEach(s => { if(String(s.id).indexOf('demo_') === 0 && s.code) treffer.push(['del','einsicht', s.code]); });
  if(!treffer.length) return toast('Kein Demo-Jahr vorhanden');
  if(!confirm('Demo-Jahr vollständig löschen? ' + treffer.length + ' Einträge werden entfernt.')) return;
  aktGruppe = '';
  schreibe(treffer).then(() => toast('Demo-Jahr gelöscht'));
}

/* Übersicht aller Einsichtslinks des Demo-Jahres – praktisch für den Elternabend */
function demoLinks(){
  const sch = Object.values(D.schueler).filter(s => String(s.id).indexOf('demo_') === 0);
  if(!sch.length) return toast('Kein Demo-Jahr vorhanden');
  const basis = (einst().url || (location.protocol === 'https:' ? location.origin + location.pathname : '')).split('#')[0];
  let h = '<p class="sub">So sehen Eltern die Seite. Am Elternabend am besten vorher öffnen.</p>'+
    '<div style="overflow:auto"><table class="liste"><thead><tr><th>Schüler</th><th>Profil im Beispiel</th><th>Link</th></tr></thead><tbody>';
  sch.forEach((s, i) => {
    const url = basis ? basis + '#e=' + s.code : '#e=' + s.code;
    h += '<tr><td><b>'+esc(s.vorname+' '+s.nachname)+'</b></td><td>'+esc((DEMO_SCHUELER[i]||[])[4]||'')+'</td>'+
      '<td><a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(s.code)+'</a></td></tr>';
  });
  h += '</tbody></table></div>';
  fenster('Einsichtslinks des Demo-Jahres', h, '<button class="btn sek" onclick="schliesse()">Schließen</button>', 700);
}
